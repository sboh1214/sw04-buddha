# pnpm 11: ALL pnpm settings live in this file. `.npmrc` is read for auth/registry only.
packages:
  - "apps/*"
  - "packages/*"

# ---- install behaviour ----------------------------------------------------
strictPeerDependencies: false # default; explicit because a few packages still declare Nest ^11 / TS ^5 peers
autoInstallPeers: true # default
nodeLinker: isolated # default. Expo SDK 54+ supports isolated deps; switch to `hoisted` only if native builds break.

# ---- dependency build scripts --------------------------------------------
# pnpm 11 default strictDepBuilds=true: any dependency with an unreviewed (post)install script
# fails `pnpm install` with ERR_PNPM_IGNORED_BUILDS. Decide here (or run `pnpm approve-builds <pkg>`).
allowBuilds:
  esbuild: true # tsx / vitest (vite) / drizzle-kit
  msgpackr-extract: true # optional native accelerator pulled in by bullmq (msgpackr)
  fsevents: false # darwin-only optional dep of tsx/vite; ships a prebuilt binary, node-gyp must not run
  "@scarf/scarf": false # install-time telemetry only

# ---- overrides -----------------------------------------------------------
# One Fastify for the whole tree. @nestjs/platform-fastify pins an exact `fastify` of its own
# (12.0.2 → 5.12.4) and FastifyAdapter builds the server from THAT copy, so a catalog version that
# differs leaves two: apps/api type-checks its plugins and its log controller against the other
# (`nest build` fails on `typeof fastifyHelmet` and `ApiLogController`), and at boot Fastify's
# `instanceof LogController` refuses an ApiLogController made from the other copy. The adapter's
# 5.12.4 is also below the 5.12.5 HTTP/2 trailer fix. Every `fastify` resolves to the catalog's,
# the adapter's included, so when @nestjs/platform-fastify is bumped keep the catalog's `fastify`
# at or above the version it pins (the adapter imports fastify/lib internals).
overrides:
  fastify: "catalog:"

# ---- supply-chain policy --------------------------------------------------
# minimumReleaseAge is left at the pnpm 11 default (1440 min, non-strict). When a pinned version is
# younger than 24h, pnpm installs it anyway but APPENDS a `minimumReleaseAgeExclude:` list to this
# file. Commit that list: `pnpm install --frozen-lockfile` (CI) rejects the lockfile without it.

# ---- versions (exact pins; every workspace package uses "catalog:") -------
# Only packages used by the current milestone are listed. Later milestones add their own
# entries at the latest stable version of that time (PLAN 0.1-4).
catalog:
  # language / runtime
  typescript: 6.0.3
  "@types/node": 24.13.3
  tsx: 4.23.13
  dotenv: 17.4.2
  zod: 4.6.7
  pino: 10.3.1
  pino-pretty: 13.1.3
  # web
  next: 16.4.3
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@chakra-ui/react": 3.37.0
  "@emotion/react": 11.14.0
  "@emotion/cache": 11.14.0
  next-themes: 0.4.6
  pretendard: 1.3.9
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  # api / worker
  "@nestjs/core": 12.0.1
  "@nestjs/common": 12.0.1
  "@nestjs/platform-fastify": 12.0.2
  "@nestjs/testing": 12.0.1
  "@nestjs/config": 12.0.0
  "@nestjs/cli": 12.0.0
  fastify: 5.12.6
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  ioredis: 6.0.0
  bullmq: 6.3.4
  # hardening (M6, PLAN 7.5 / 보안 헤더 / 요청 로깅). `@nestjs/throttler` declares Nest ^11 as its
  # peer, like `@thallesp/nestjs-better-auth` before it (ADR-0018); `strictPeerDependencies: false`
  # above covers both. `pino`/`pino-pretty` are already pinned under "language / runtime" for the
  # worker and apps/api now uses the same versions.
  "@nestjs/throttler": 6.5.0
  "@fastify/helmet": 13.1.1
  # realtime (M4, PLAN 8): Socket.IO gateway in apps/api, client in apps/web.
  "@nestjs/websockets": 12.0.1
  "@nestjs/platform-socket.io": 12.0.1
  socket.io: 4.8.3
  "@socket.io/redis-adapter": 8.3.0
  socket.io-client: 4.8.3
  # auth / mail (M1)
  better-auth: 1.7.7
  auth: 1.7.7 # the schema generator (packages/db db:auth-schema): keep it at better-auth's version
  "@thallesp/nestjs-better-auth": 2.7.0
  nodemailer: 10.3.1 # 10 is TypeScript and ships its own types (no @types/nodemailer)
  "@nestjs/swagger": 12.0.1
  "@standard-schema/spec": 1.1.0
  # web data layer (M1)
  "@tanstack/react-query": 5.102.8
  react-hook-form: 7.87.0
  "@hookform/resolvers": 5.9.1
  "@playwright/test": 1.62.1
  # db
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  "@types/pg": 8.23.1
  # media (#46, ADR-0073): the post images. sharp decodes, checks, re-encodes and strips the
  # metadata of an upload in the API (prebuilt libvips binaries per platform as optional
  # dependencies, no install script); the S3 client is @buddha/storage's driver for the private
  # bucket the API and the worker share.
  sharp: 0.35.5
  "@aws-sdk/client-s3": 3.1146.0
  # the post editor (#46, ADR-0073): TipTap 3 over ProseMirror, in apps/web only. Its JSON is the
  # stored format (TipTap's node and mark names); the server's allow-list (@buddha/shared
  # post-document.ts) decides what of it is kept, so the editor is a convenience, not a boundary.
  "@tiptap/react": 3.32.0
  "@tiptap/pm": 3.32.0
  "@tiptap/starter-kit": 3.32.0
  "@tiptap/extension-table": 3.32.0
  "@tiptap/extension-text-style": 3.32.0
  "@tiptap/extensions": 3.32.0
  # mobile (react / react-native for mobile come from the `expo` catalog below)
  expo: 57.0.19
  expo-dev-client: 57.0.18
  expo-status-bar: 57.0.1
  expo-doctor: 1.20.4
  # test
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
  fast-check: 4.9.0
  # lint / format / build tooling
  eslint: 10.9.1
  "@eslint/js": 10.0.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  "@next/eslint-plugin-next": 16.3.4
  globals: 17.12.0
  prettier: 3.9.6
  turbo: 2.10.12

catalogs:
  # Expo SDK 57 requires these EXACT versions (expo-doctor fails on 19.2.8 / 0.87.1).
  # apps/mobile uses "react": "catalog:expo", "react-native": "catalog:expo".
  expo:
    react: 19.2.3
    react-native: 0.86.3

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/router-server@57.0.9'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-dev-client@57.0.18
  - expo-dev-launcher@57.0.19
  - expo-dev-menu@57.0.18
  - expo-font@57.0.3
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo@57.0.19
