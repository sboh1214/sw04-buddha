# pnpm 11: ALL pnpm settings live in this file. `.npmrc` is read for auth/registry only.
packages:
  - "apps/*"
  - "packages/*"

# ---- install behaviour ----------------------------------------------------
strictPeerDependencies: false # default; explicit because a few packages still declare Nest ^11 / TS ^5 peers
autoInstallPeers: true # default
nodeLinker: isolated # default. Expo SDK 54+ supports isolated deps; switch to `hoisted` only if native builds break.

# ---- dependency build scripts --------------------------------------------
# pnpm 11 default strictDepBuilds=true: any dependency with an unreviewed (post)install script
# fails `pnpm install` with ERR_PNPM_IGNORED_BUILDS. Decide here (or run `pnpm approve-builds <pkg>`).
allowBuilds:
  esbuild: true # tsx / vitest (vite) / drizzle-kit
  msgpackr-extract: true # optional native accelerator pulled in by bullmq (msgpackr)
  fsevents: false # darwin-only optional dep of tsx/vite; ships a prebuilt binary, node-gyp must not run
  "@scarf/scarf": false # install-time telemetry only

# ---- supply-chain policy --------------------------------------------------
# minimumReleaseAge is left at the pnpm 11 default (1440 min, non-strict). When a pinned version is
# younger than 24h, pnpm installs it anyway but APPENDS a `minimumReleaseAgeExclude:` list to this
# file. Commit that list: `pnpm install --frozen-lockfile` (CI) rejects the lockfile without it.

# ---- versions (exact pins; every workspace package uses "catalog:") -------
# Only packages used by the current milestone are listed. Later milestones add their own
# entries at the latest stable version of that time (PLAN 0.1-4).
catalog:
  # language / runtime
  typescript: 6.0.3
  "@types/node": 24.13.3
  tsx: 4.23.13
  dotenv: 17.4.2
  zod: 4.5.4
  pino: 10.3.1
  pino-pretty: 13.1.3
  # web
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@chakra-ui/react": 3.37.0
  "@emotion/react": 11.14.0
  "@emotion/cache": 11.14.0
  next-themes: 0.4.6
  pretendard: 1.3.9
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  # api / worker
  "@nestjs/core": 12.0.1
  "@nestjs/common": 12.0.1
  "@nestjs/platform-fastify": 12.0.1
  "@nestjs/testing": 12.0.1
  "@nestjs/config": 12.0.0
  "@nestjs/cli": 12.0.0
  fastify: 5.12.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  ioredis: 6.0.0
  bullmq: 6.3.4
  # db
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  "@types/pg": 8.23.1
  # mobile (react / react-native for mobile come from the `expo` catalog below)
  expo: 57.0.19
  expo-dev-client: 57.0.18
  expo-status-bar: 57.0.1
  expo-doctor: 1.20.4
  # test
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
  fast-check: 4.9.0
  # lint / format / build tooling
  eslint: 10.9.1
  "@eslint/js": 10.0.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  "@next/eslint-plugin-next": 16.3.4
  globals: 17.12.0
  prettier: 3.9.6
  turbo: 2.10.12

catalogs:
  # Expo SDK 57 requires these EXACT versions (expo-doctor fails on 19.2.8 / 0.87.1).
  # apps/mobile uses "react": "catalog:expo", "react-native": "catalog:expo".
  expo:
    react: 19.2.3
    react-native: 0.86.3

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/router-server@57.0.9'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-dev-client@57.0.18
  - expo-dev-launcher@57.0.19
  - expo-dev-menu@57.0.18
  - expo-font@57.0.3
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo@57.0.19
