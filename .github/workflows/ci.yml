name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is its own job on its own runner, so they run side by side instead of one after
# another, and each job with a database gets a Postgres of its own: the integration suites no
# longer wait on each other's file lock (packages/db/src/test/harness.ts), and the e2e no
# longer has to empty what the tests left behind. The last job gathers them under the one
# status check the main ruleset requires.
#
# Only variables declared in turbo.json (`env` / `passThroughEnv` / framework inference) reach
# tasks: Turborepo runs in strict env mode. Add new keys there first. The exception is
# everything the e2e job needs: Playwright and the three servers run outside turbo, so they
# read this block directly.
# Locally TEST_* point at the docker `test` profile (5433/6380); here the service containers
# double as the test database, so TEST_* and DATABASE_* are the same server. Jobs without
# service containers never connect: lint, typecheck and build only need the values to exist.
env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  DATABASE_URL: postgres://buddha_app:buddha@localhost:5432/buddha
  DATABASE_MIGRATE_URL: postgres://buddha_migrate:buddha@localhost:5432/buddha
  REDIS_URL: redis://localhost:6379
  TEST_DATABASE_URL: postgres://buddha_app:buddha@localhost:5432/buddha
  TEST_DATABASE_MIGRATE_URL: postgres://buddha_migrate:buddha@localhost:5432/buddha
  TEST_REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000
  # The worker's liveness probe the e2e job waits on (apps/worker/src/health.ts).
  WORKER_HOST: localhost
  WORKER_HEALTH_PORT: '4100'
  # better-auth (M1). Fixed test secret; never reuse outside CI.
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  WEB_ORIGIN: http://localhost:3000
  # Reaches the e2e job's Mailpit service container. The vitest suites still never send mail:
  # apps/api/src/test/setup-env.ts pins its own SMTP_HOST and the MAILER is overridden.
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_FROM: noreply@buddha.local
  # e2e only: the sign-up helper polls Mailpit's HTTP API for the verification link, and
  # the specs drive the web server the e2e job starts.
  MAILPIT_URL: http://127.0.0.1:8025
  E2E_BASE_URL: http://localhost:3000
  # db:seed skips the admin — and with it the seeded markets — unless both are set
  # (packages/db/src/seed.ts); the e2e signs in as this admin to open its own market. The
  # second bootstrap admin: the two-person rule needs two distinct admins here too (#171).
  SEED_ADMIN_EMAIL: admin@buddha.local
  SEED_ADMIN_PASSWORD: ci-only-admin-password
  SEED_SECOND_ADMIN_EMAIL: admin2@buddha.local
  SEED_SECOND_ADMIN_PASSWORD: ci-only-second-admin-password

jobs:
  prettier:
    name: Check with Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint with ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: lint

      # web#lint depends on web#build (apps/web/turbo.json, ADR-0016), so this job builds the
      # web app too.
      - name: Lint the workspace
        run: pnpm turbo run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: typecheck

      # web#typecheck also waits for web#build: both write .next/types (ADR-0016).
      - name: Run type check
        run: pnpm turbo run typecheck

  build:
    name: Build and Check API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: build

      - name: Build the workspace
        run: pnpm turbo run build

      # PLAN 14 API contract check: the committed OpenAPI document, the generated client types
      # and docs/API.md (generated from that document by scripts/generate-api-doc.mjs) must all
      # match the code.
      - name: OpenAPI contract check
        run: |
          pnpm api:openapi
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated docs/API.md

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: unit

      # Every package but the three whose suites need Postgres and Redis (test-integration
      # below), so a new package's tests land here without touching this file.
      - name: Run unit tests
        run: pnpm turbo run test --filter='!api' --filter='!@buddha/db' --filter='!worker'

  test-integration:
    name: Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # api's suite runs its files one after another on one database (fileParallelism: false):
    # 126 files took 28 minutes in one job by #144 (2026-11-24) and hit the old 30-minute limit
    # on main. It is split by file into three vitest shards, each a job with its own runner,
    # Postgres and Redis, so a shard takes about ten minutes. Add a shard here, not minutes.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api 1/3
            cache: api-1
            filter: api
            args: '-- --shard=1/3'
          - name: api 2/3
            cache: api-2
            filter: api
            args: '-- --shard=2/3'
          - name: api 3/3
            cache: api-3
            filter: api
            args: '-- --shard=3/3'
          - name: db
            cache: db
            filter: '@buddha/db'
            args: ''
          - name: worker
            cache: worker
            filter: worker
            args: ''

    # The superuser below is only used to apply docker/postgres/init/01-roles.sql; tasks then
    # connect with the same buddha_app / buddha_migrate roles as local development (PLAN 6.4).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: integration-${{ matrix.cache }}

      - name: Create database roles (same SQL as docker compose)
        run: psql postgres://postgres:postgres@localhost:5432/buddha -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      # Applies packages/db/drizzle/* as buddha_migrate (DATABASE_MIGRATE_URL) so the
      # integration tests find the schema. Also proves the committed migrations apply cleanly
      # on an empty database.
      - name: Run migrations
        run: pnpm db:migrate

      # `--log-order=stream` prints vitest's lines as they come: turbo's default on Actions
      # holds a task's output until the task ends, so a job cancelled at its time limit used to
      # show nothing of the suite. The args after `--` (the shard) reach vitest and turbo's
      # task hash alike, so each shard caches on its own.
      - name: Run integration tests
        run: pnpm turbo run test --filter='${{ matrix.filter }}' --log-order=stream ${{ matrix.args }}

  # ---- e2e (PLAN 14 AC 7, A-M1-10): its own build, database and servers per shard ----------------
  e2e:
    name: E2E Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Includes the build, Chromium, seed and both projects. Shared-setting scenarios use one
    # worker per DB, so a shard runs its tests one after another: with three shards each took
    # 50 minutes by #144 (2026-11-24) and one hit this limit on main. With five, main's slowest
    # shard took 39.5 minutes (ADR-0168); six take about 30 each. Per-test timeouts, retries and
    # failure handling remain unchanged.
    timeout-minutes: 60

    # The specs are split across the shards by test (fullyParallel), mobile-375 and
    # desktop-1280 alike. Add a shard here to split them further: the main ruleset requires
    # only the summary job's check at the bottom (ADR-0168), so a shard's name is free to change.
    # Each shard seeds a database of its own, and the service-wide limit of 500 verification
    # sends in 24 hours (ADR-0070, a fixed owner value) counts that database's sends alone: the
    # whole suite sends some five hundred (ADR-0092), so it needs two shards at least.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: shard-1
            label: Playwright 1/6
            command: pnpm --filter web test:e2e --shard=1/6
          - id: shard-2
            label: Playwright 2/6
            command: pnpm --filter web test:e2e --shard=2/6
          - id: shard-3
            label: Playwright 3/6
            command: pnpm --filter web test:e2e --shard=3/6
          - id: shard-4
            label: Playwright 4/6
            command: pnpm --filter web test:e2e --shard=4/6
          - id: shard-5
            label: Playwright 5/6
            command: pnpm --filter web test:e2e --shard=5/6
          - id: shard-6
            label: Playwright 6/6
            command: pnpm --filter web test:e2e --shard=6/6
          # Both dedicated profiles have their own service DB/Redis and run both viewports.
          # Their tests are excluded from the general profile, never skipped from CI.
          - id: market-maker
            label: Market maker quotes
            command: pnpm --filter web test:e2e:market-maker
          - id: treasury
            label: Isolated treasury
            command: pnpm --filter web test:e2e:treasury

    # Mailpit exists for the Playwright e2e alone: every spec signs up and reads the
    # verification link out of Mailpit's HTTP API. The vitest suites never reach it — they
    # replace the MAILER provider with an in-memory mailer (ADR-0022).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Same image and SMTP settings as docker/docker-compose.yml (accept any login, no TLS).
      # No health options: the image ships its own HEALTHCHECK (`mailpit readyz`), which the
      # runner waits for; no volume either, so each run starts with an empty mailbox.
      mailpit:
        image: axllent/mailpit:v1.31.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: e2e

      - name: Create database roles (same SQL as docker compose)
        run: psql postgres://postgres:postgres@localhost:5432/buddha -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      - name: Run migrations
        run: pnpm db:migrate

      - name: Build the API, the worker and the web app
        run: pnpm turbo run build --filter=api --filter=worker --filter=web

      # Use the lockfile's Chromium. The hosted image already supplies native libraries;
      # verify an actual launch and the app's self-hosted Korean font below. A missing
      # library/font must fail that step rather than depend on unrelated APT font mirrors.
      - name: Install Playwright chromium
        run: pnpm --filter web exec playwright install chromium

      # The e2e flow needs the categories, and its market fixture is created through the admin API
      # as the seeded admin (SEED_ADMIN_* above) and approved by the second one
      # (SEED_SECOND_ADMIN_*, #171) — a market opens only through the review (#78, #21); the
      # admin-accounts spec needs exactly these two admins. Since #171 the
      # seed creates them only while no account is an admin, which holds here: no test ran on
      # this job's database, so it has the migrations and nothing else. No spec charges:
      # paid Coin is closed (ADR-0049), and the payment spec puts a package on sale itself (the
      # seed's are off sale, #125) to show the charge is refused anyway. db:seed declares
      # DATABASE_URL and the four SEED_*ADMIN_* keys in turbo.json's passThroughEnv.
      - name: Seed the database
        run: pnpm db:seed

      # `next start`, not `pnpm --filter web start`: `.next/standalone/**` is excluded from
      # build.outputs (turbo.json, ADR-0016), so after a Turborepo cache hit the standalone copy
      # is missing and the start script exits 1 on its BUILD_ID check. `next start` serves the
      # restored `.next` and only warns about output: 'standalone' (only 'export' throws).
      # Logs go to files so the step can exit while all three servers keep running.
      # The worker too (M5): the settlement spec, the themes spec's confirmation test, the
      # dispute spec's deadline test (#175) and the correction spec's two tests (#176: a
      # correction's new deadline, and a rejected correction's confirmation past the old one)
      # wait on its `market.resolve` at the dispute deadline (#152; the e2e global setup sets a
      # 1-minute window), the settlement spec then on `market.finalize`, and
      # scheduled-open.spec.ts on its `market.open` (#21).
      - name: Start the API, the worker and the web server
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          pnpm --filter api start > "$RUNNER_TEMP/e2e-logs/api.log" 2>&1 &
          pnpm --filter worker start > "$RUNNER_TEMP/e2e-logs/worker.log" 2>&1 &
          pnpm --filter web exec next start --port 3000 > "$RUNNER_TEMP/e2e-logs/web.log" 2>&1 &

      # The API first: the home page renders server-side against it, so probing the web origin
      # before the API is up would retry on a 500. `localhost` is IPv4-only on the runner, which
      # is what all three servers bind.
      - name: Wait for the stack
        run: |
          for url in \
            http://localhost:4000/api/health \
            http://localhost:4100/health \
            http://127.0.0.1:8025/readyz \
            http://localhost:3000/; do
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "ready: $url"
                continue 2
              fi
              sleep 2
            done
            echo "::error::timed out waiting for $url"
            tail -n 50 "$RUNNER_TEMP/e2e-logs/"*.log || true
            exit 1
          done

      # Installation only warns about missing host libraries. Launch without a custom
      # executable or validation bypass, and require actual Pretendard Korean glyphs.
      - name: Verify browser runtime and Korean font
        run: pnpm --filter web exec node e2e/verify-runtime.mjs

      # Invoked outside turbo (pnpm runs the package script directly), so CI / E2E_BASE_URL /
      # MAILPIT_URL reach Playwright from the workflow env and turbo.json stays untouched.
      - name: Playwright e2e (mobile-375 + desktop-1280)
        run: ${{ matrix.command }}

      # Every run's results, passing runs included (#189, ADR-0178): the JSON report this
      # configuration wrote (`e2eReporters` in apps/web/playwright.config.ts), for e2e-summary
      # below. 90 days, the repository's retention (its maximum); a re-run replaces its job's file.
      # Nothing to upload when a step before the e2e is what failed. A failure to keep results is
      # reported, never a merge blocker: a failed upload leaves this job (and through it the gate)
      # as the e2e left it, and e2e-summary then misses this job's file and fails instead.
      - name: Upload the e2e results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ matrix.id }}
          path: apps/web/e2e-results/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # Traces (trace: 'on-first-retry' with retries: 2 in CI) plus whatever report the run
      # produced, and all three server logs. Ignored when a step before the e2e is what failed.
      # A re-run that fails again replaces its job's report instead of failing on the name.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # One summary of all the e2e jobs' results (#189, ADR-0178): the commit, each configuration's
  # and each shard's passed / failed / flaky / skipped and the totals with every test counted once
  # (apps/web/scripts/e2e-summary.mjs), as this job's summary and the artifact e2e-summary-<sha>
  # for 90 days — two small files, small enough to commit as evidence: the launch check (#149)
  # accepts the main run of the deployed sha alone. It reports and is not one of the gate's needs,
  # so the ruleset is unchanged (ADR-0168): a failed test already fails its e2e job and through it
  # the gate. It fails only when every e2e job passed and the summary is still incomplete (a result
  # missing, an error outside the tests, a test interrupted, not run or in two files, an unreadable
  # file …), because then it does not cover the whole run. It runs after failed or timed-out e2e
  # jobs too, but not in a cancelled run (a newer push to the same ref): #149 never uses one.
  e2e-summary:
    name: E2E Results Summary
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup

      # Into a folder per artifact when more than one matches, straight into e2e-results/ when
      # only one does; the summary reads the folder recursively, so either way works.
      - name: Download the e2e results
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-results-*
          path: e2e-results

      # The --expect list follows the e2e matrix: general (whose results number its shards
      # themselves), market-maker and treasury. A pull request's run tests the merge commit
      # (github.sha), so its head is named beside it.
      - name: Summarize the e2e results
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--out e2e-summary --expect general --expect market-maker --expect treasury)
          if [ "$E2E_RESULT" = success ]; then args+=(--require-complete); fi
          status=0
          node apps/web/scripts/e2e-summary.mjs "${args[@]}" e2e-results || status=$?
          if [ -f e2e-summary/e2e-summary.md ]; then
            cat e2e-summary/e2e-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload the e2e summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-summary-${{ github.sha }}
          path: e2e-summary/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  # The main ruleset requires a status check with exactly this name, which was the single job's
  # before the split; keep it, or change the ruleset in the same breath. A cancelled, failed or
  # skipped job of its needs fails it, so it never passes on part of the checks. e2e-summary is
  # deliberately not one of them (above).
  ci:
    name: format / lint / typecheck / test / build
    if: always()
    needs: [prettier, lint, typecheck, build, test, test-integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a required job ended as $result"
              exit 1
            fi
          done
