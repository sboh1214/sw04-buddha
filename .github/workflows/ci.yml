name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  ci:
    name: format / lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ready for later integration tests (harmless now). The superuser below is only used
    # to apply docker/postgres/init/01-roles.sql; tasks then connect with the same
    # buddha_app / buddha_migrate roles as local development (PLAN 6.4).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Only variables declared in turbo.json (`env` / `passThroughEnv` / framework
    # inference) reach tasks: Turborepo runs in strict env mode. Add new keys there first.
    env:
      DATABASE_URL: postgres://buddha_app:buddha@localhost:5432/buddha
      DATABASE_MIGRATE_URL: postgres://buddha_migrate:buddha@localhost:5432/buddha
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      TEST_DISPUTE_WINDOW_SECONDS: '86400'

    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from package.json "packageManager") and Node 24, caches the
      # pnpm store, then runs `pnpm install` itself (frozen lockfile: pnpm's CI default).
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Create database roles (same SQL as docker compose)
        run: psql postgres://postgres:postgres@localhost:5432/buddha -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prettier
        run: pnpm format:check

      - name: Lint / typecheck / test / build
        run: pnpm turbo run lint typecheck test build
