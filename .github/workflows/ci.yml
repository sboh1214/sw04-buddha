name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is its own job on its own runner, so they run side by side instead of one after
# another, and each job with a database gets a Postgres of its own: the integration suites no
# longer wait on each other's file lock (packages/db/src/test/harness.ts), and the e2e no
# longer has to empty what the tests left behind. The last job gathers them under the one
# status check the main ruleset requires.
#
# Only variables declared in turbo.json (`env` / `passThroughEnv` / framework inference) reach
# tasks: Turborepo runs in strict env mode. Add new keys there first. The exception is
# everything the e2e job needs: Playwright and the three servers run outside turbo, so they
# read this block directly.
# Locally TEST_* point at the docker `test` profile (5433/6380); here the service containers
# double as the test database, so TEST_* and DATABASE_* are the same server. Jobs without
# service containers never connect: lint, typecheck and build only need the values to exist.
env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  DATABASE_URL: postgres://buddha_app:buddha@localhost:5432/buddha
  DATABASE_MIGRATE_URL: postgres://buddha_migrate:buddha@localhost:5432/buddha
  REDIS_URL: redis://localhost:6379
  TEST_DATABASE_URL: postgres://buddha_app:buddha@localhost:5432/buddha
  TEST_DATABASE_MIGRATE_URL: postgres://buddha_migrate:buddha@localhost:5432/buddha
  TEST_REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000
  # The worker's liveness probe the e2e job waits on (apps/worker/src/health.ts).
  WORKER_HOST: localhost
  WORKER_HEALTH_PORT: '4100'
  # better-auth (M1). Fixed test secret; never reuse outside CI.
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  WEB_ORIGIN: http://localhost:3000
  # Reaches the e2e job's Mailpit service container. The vitest suites still never send mail:
  # apps/api/src/test/setup-env.ts pins its own SMTP_HOST and the MAILER is overridden.
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_FROM: noreply@buddha.local
  # e2e only: the sign-up helper polls Mailpit's HTTP API for the verification link, and
  # the specs drive the web server the e2e job starts.
  MAILPIT_URL: http://127.0.0.1:8025
  E2E_BASE_URL: http://localhost:3000
  # db:seed skips the admin — and with it the seeded markets — unless both are set
  # (packages/db/src/seed.ts); the e2e signs in as this admin to open its own market. The
  # second bootstrap admin: the two-person rule needs two distinct admins here too (#171).
  SEED_ADMIN_EMAIL: admin@buddha.local
  SEED_ADMIN_PASSWORD: ci-only-admin-password
  SEED_SECOND_ADMIN_EMAIL: admin2@buddha.local
  SEED_SECOND_ADMIN_PASSWORD: ci-only-second-admin-password

jobs:
  prettier:
    name: Check with Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint with ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: lint

      # web#lint depends on web#build (apps/web/turbo.json, ADR-0016), so this job builds the
      # web app too.
      - name: Lint the workspace
        run: pnpm turbo run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: typecheck

      # web#typecheck also waits for web#build: both write .next/types (ADR-0016).
      - name: Run type check
        run: pnpm turbo run typecheck

  build:
    name: Build and Check API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: build

      - name: Build the workspace
        run: pnpm turbo run build

      # PLAN 14 API contract check: the committed OpenAPI document, the generated client types
      # and docs/API.md (generated from that document by scripts/generate-api-doc.mjs) must all
      # match the code.
      - name: OpenAPI contract check
        run: |
          pnpm api:openapi
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated docs/API.md

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: unit

      # Every package but the three whose suites need Postgres and Redis (test-integration
      # below), so a new package's tests land here without touching this file.
      - name: Run unit tests
        run: pnpm turbo run test --filter='!api' --filter='!@buddha/db' --filter='!worker'

  test-integration:
    name: Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            filter: api
          - name: db
            filter: '@buddha/db'
          - name: worker
            filter: worker

    # The superuser below is only used to apply docker/postgres/init/01-roles.sql; tasks then
    # connect with the same buddha_app / buddha_migrate roles as local development (PLAN 6.4).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: integration-${{ matrix.name }}

      - name: Create database roles (same SQL as docker compose)
        run: psql postgres://postgres:postgres@localhost:5432/buddha -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      # Applies packages/db/drizzle/* as buddha_migrate (DATABASE_MIGRATE_URL) so the
      # integration tests find the schema. Also proves the committed migrations apply cleanly
      # on an empty database.
      - name: Run migrations
        run: pnpm db:migrate

      - name: Run integration tests
        run: pnpm turbo run test --filter='${{ matrix.filter }}'

  # ---- e2e (PLAN 14 AC 7, A-M1-10): its own build, database and servers per shard ----------------
  e2e:
    name: E2E Tests (Playwright ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Covers the build, the chromium download, the seed and this shard's specs of both projects.
    timeout-minutes: 30

    # The specs are split across the shards by test (fullyParallel), mobile-375 and
    # desktop-1280 alike. Add a shard here to split them further.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Mailpit exists for the Playwright e2e alone: every spec signs up and reads the
    # verification link out of Mailpit's HTTP API. The vitest suites never reach it — they
    # replace the MAILER provider with an in-memory mailer (ADR-0022).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Same image and SMTP settings as docker/docker-compose.yml (accept any login, no TLS).
      # No health options: the image ships its own HEALTHCHECK (`mailpit readyz`), which the
      # runner waits for; no volume either, so each run starts with an empty mailbox.
      mailpit:
        image: axllent/mailpit:v1.31.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
        with:
          turbo-cache: e2e

      - name: Create database roles (same SQL as docker compose)
        run: psql postgres://postgres:postgres@localhost:5432/buddha -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      - name: Run migrations
        run: pnpm db:migrate

      - name: Build the API, the worker and the web app
        run: pnpm turbo run build --filter=api --filter=worker --filter=web

      # Playwright uses its own Chromium build, not the runner's Google Chrome package.
      # Disable that unused APT source so its index (e.g. Hash Sum mismatch) cannot break
      # the apt-get update performed by --with-deps. Keep Ubuntu's dependency sources.
      - name: Disable unused Google Chrome APT repository
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources

      # Install the browser through the web package to match the lockfile's Playwright.
      - name: Install Playwright chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The e2e flow needs the categories, and its market fixture is created through the admin API
      # as the seeded admin (SEED_ADMIN_* above); the admin-accounts spec also signs in as the
      # second one (SEED_SECOND_ADMIN_*, #171) and needs exactly these two admins. Since #171 the
      # seed creates them only while no account is an admin, which holds here: no test ran on
      # this job's database, so it has the migrations and nothing else. No spec charges:
      # paid Coin is closed (ADR-0049), and the payment spec puts a package on sale itself (the
      # seed's are off sale, #125) to show the charge is refused anyway. db:seed declares
      # DATABASE_URL and the four SEED_*ADMIN_* keys in turbo.json's passThroughEnv.
      - name: Seed the database
        run: pnpm db:seed

      # `next start`, not `pnpm --filter web start`: `.next/standalone/**` is excluded from
      # build.outputs (turbo.json, ADR-0016), so after a Turborepo cache hit the standalone copy
      # is missing and the start script exits 1 on its BUILD_ID check. `next start` serves the
      # restored `.next` and only warns about output: 'standalone' (only 'export' throws).
      # Logs go to files so the step can exit while all three servers keep running.
      # The worker too (M5): the settlement spec waits on its `market.finalize` job.
      - name: Start the API, the worker and the web server
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          pnpm --filter api start > "$RUNNER_TEMP/e2e-logs/api.log" 2>&1 &
          pnpm --filter worker start > "$RUNNER_TEMP/e2e-logs/worker.log" 2>&1 &
          pnpm --filter web exec next start --port 3000 > "$RUNNER_TEMP/e2e-logs/web.log" 2>&1 &

      # The API first: the home page renders server-side against it, so probing the web origin
      # before the API is up would retry on a 500. `localhost` is IPv4-only on the runner, which
      # is what all three servers bind.
      - name: Wait for the stack
        run: |
          for url in \
            http://localhost:4000/api/health \
            http://localhost:4100/health \
            http://127.0.0.1:8025/readyz \
            http://localhost:3000/; do
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "ready: $url"
                continue 2
              fi
              sleep 2
            done
            echo "::error::timed out waiting for $url"
            tail -n 50 "$RUNNER_TEMP/e2e-logs/"*.log || true
            exit 1
          done

      # Invoked outside turbo (pnpm runs the package script directly), so CI / E2E_BASE_URL /
      # MAILPIT_URL reach Playwright from the workflow env and turbo.json stays untouched.
      - name: Playwright e2e (mobile-375 + desktop-1280)
        run: pnpm --filter web test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Traces (trace: 'on-first-retry' with retries: 2 in CI) plus whatever report the run
      # produced, and all three server logs. Ignored when a step before the e2e is what failed.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  # The main ruleset requires a status check with exactly this name, which was the single job's
  # before the split; keep it, or change the ruleset in the same breath. A cancelled, failed or
  # skipped job above fails it, so it never passes on part of the checks.
  ci:
    name: format / lint / typecheck / test / build
    if: always()
    needs: [prettier, lint, typecheck, build, test, test-integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a required job ended as $result"
              exit 1
            fi
          done
