name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  ci:
    name: format / lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ready for later integration tests (harmless now). Roles/DB names mirror .env.example;
    # the docker-compose role-init SQL is not applied here, so a superuser is used.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buddha
          POSTGRES_PASSWORD: buddha
          POSTGRES_DB: buddha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://buddha:buddha@localhost:5432/buddha
      DATABASE_MIGRATE_URL: postgres://buddha:buddha@localhost:5432/buddha
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      TEST_DISPUTE_WINDOW_SECONDS: '86400'

    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from package.json "packageManager") AND Node 24, caches the pnpm store,
      # then runs `pnpm install --frozen-lockfile` (require-lockfile). Replaces actions/setup-node.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prettier
        run: pnpm format:check

      - name: Lint / typecheck / test / build
        run: pnpm turbo run lint typecheck test build
